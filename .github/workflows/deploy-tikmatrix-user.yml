name: Deploy tikmatrix-user to VPS
run-name: Deploy tikmatrix-user → ${{ inputs.server || 'all servers' }} by ${{ github.actor }} 🚀

# tikmatrix-user 以自包含的 Node 服务运行在 VPS 集群上：
#   npm run build → dist/server.js（无 node_modules）
#   → /home/deploy/apps/tikmatrix-user/server.js
#   → systemd tikmatrix-user.service，监听 127.0.0.1:3001
#   → 宿主机 Nginx（LinuxConfig/nginx/user.tikmatrix.com.conf）反向代理
#
# Nginx 配置本身由 server-operations.yml 的 nginx-deploy-config 操作下发，
# 不在本工作流内。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from in tikmatrix-user"
        required: false
        default: "main"
        type: string

      # GitHub Actions 无法动态填充 choice 选项，这里只是
      # LinuxConfig/deploy-config.json `.servers[].id` 的一份便利镜像。
      # 真正的部署目标始终在运行时从该文件解析。
      server:
        description: "Target server (leave empty to deploy to all configured servers)"
        required: false
        type: choice
        options:
          - ""
          - server-us
          - server-dublin
          - server-sgp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 3000 已被 tikmatrix-api-rs 占用；改这里必须同步改
  # LinuxConfig/nginx/user.tikmatrix.com.conf 的 upstream。
  APP_PORT: "3001"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.get-servers.outputs.servers }}
    steps:
      # LinuxConfig/deploy-config.json 是服务器清单的唯一事实来源。
      - name: Checkout LinuxConfig repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tikmatrix/LinuxConfig
          token: ${{ secrets.REPO_TOKEN }}
          path: LinuxConfig

      - name: Determine target servers
        id: get-servers
        run: |
          CONFIG=$(cat LinuxConfig/deploy-config.json)
          SELECTED_SERVER="${{ github.event.inputs.server }}"

          KNOWN_SERVERS=$(echo "$CONFIG" | jq -r '[.servers[].id] | join(", ")')
          echo "Servers defined in LinuxConfig/deploy-config.json: $KNOWN_SERVERS"

          if [[ -n "$SELECTED_SERVER" ]]; then
            if ! echo "$CONFIG" | jq -e --arg id "$SELECTED_SERVER" '.servers[] | select(.id == $id)' >/dev/null; then
              echo "Error: server '$SELECTED_SERVER' is not defined in LinuxConfig/deploy-config.json"
              echo "Available servers: $KNOWN_SERVERS"
              exit 1
            fi
            SERVERS=$(echo "$CONFIG" | jq -c --arg target "$SELECTED_SERVER" '[.servers[] | select(.id == $target)]')
          else
            SERVERS=$(echo "$CONFIG" | jq -c '.servers')
          fi

          if [[ -z "$SERVERS" || "$SERVERS" == "[]" || "$SERVERS" == "null" ]]; then
            echo "Error: No servers found"
            exit 1
          fi

          echo "servers=$SERVERS" >> $GITHUB_OUTPUT
          echo "Target servers: $SERVERS"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tikmatrix-user
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tikmatrix/tikmatrix-user
          token: ${{ secrets.REPO_TOKEN }}
          ref: ${{ inputs.branch || 'main' }}
          path: tikmatrix-user

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tikmatrix-user/package-lock.json

      - name: Install dependencies
        run: cd tikmatrix-user && npm ci

      - name: Build Node server bundle
        run: cd tikmatrix-user && npm run build

      # dist/server.js 必须是自包含的：VPS 上没有 node_modules，
      # 任何非内置模块的 require 都会让服务起不来。
      - name: Verify bundle is self-contained
        run: |
          cd tikmatrix-user
          test -s dist/server.js || { echo "Error: dist/server.js missing or empty"; exit 1; }
          node --check dist/server.js
          node -e '
            const { builtinModules } = require("module");
            const src = require("fs").readFileSync("dist/server.js", "utf8");
            const bad = [...src.matchAll(/\brequire\(\s*["\x27]([^"\x27]+)["\x27]\s*\)/g)]
              .map(m => m[1])
              .filter(m => !builtinModules.includes(m.replace(/^node:/, "")));
            if (bad.length) {
              console.error("Error: dist/server.js requires non-builtin module(s): " + [...new Set(bad)].join(", "));
              process.exit(1);
            }
            console.log("Bundle is self-contained (builtins only)");
          '
          ls -lh dist/server.js

      - name: Upload server bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tikmatrix-user-server
          path: tikmatrix-user/dist/server.js
          retention-days: 1

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: ${{ fromJson(needs.prepare.outputs.servers) }}
      fail-fast: false
    steps:
      - name: Checkout LinuxConfig repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tikmatrix/LinuxConfig
          token: ${{ secrets.REPO_TOKEN }}
          path: LinuxConfig

      - name: Download server bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tikmatrix-user-server

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # systemd EnvironmentFile：只接受 KEY=value 与注释行。
      # 内容在仓库 Settings → Secrets 的 TIKMATRIX_USER_ENV_CONTENT 中维护
      # （COUNTRY_ORACLE_URL / COUNTRY_ORACLE_KEY；PORT 由部署脚本写入）。
      - name: Write .env from secret
        env:
          ENV_CONTENT: ${{ secrets.TIKMATRIX_USER_ENV_CONTENT }}
        run: |
          if [[ -z "$ENV_CONTENT" ]]; then
            echo "Error: secret TIKMATRIX_USER_ENV_CONTENT is not configured"
            exit 1
          fi
          printf '%s\n' "$ENV_CONTENT" > tikmatrix-user.env
          chmod 600 tikmatrix-user.env

          # region-api.js 在 COUNTRY_ORACLE_URL 缺失时会静默退回
          # http://localhost:8000，在服务器上就是每次请求空等 30 秒。
          # 与其让它悄悄坏掉，不如在碰服务器之前就失败。
          if ! grep -qE '^\s*COUNTRY_ORACLE_URL\s*=\s*\S' tikmatrix-user.env; then
            echo "Error: TIKMATRIX_USER_ENV_CONTENT is missing COUNTRY_ORACLE_URL"
            echo "       (without it /api/region silently falls back to localhost:8000)"
            exit 1
          fi

          echo "Keys provided: $(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' tikmatrix-user.env)"

      - name: Deploy to ${{ matrix.server.id }}
        env:
          CONFIG_FILE: LinuxConfig/deploy-config.json
          SSH_KEY_FILE: ~/.ssh/deploy_key
        run: |
          chmod +x ./LinuxConfig/shell/deploy-tikmatrix-user.sh
          ./LinuxConfig/shell/deploy-tikmatrix-user.sh \
            "${{ matrix.server.id }}" \
            "server.js" \
            "tikmatrix-user.env"

      - name: Cleanup secrets
        if: always()
        run: rm -f ~/.ssh/deploy_key tikmatrix-user.env

  notify:
    needs: [prepare, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESULTS='${{ toJson(needs) }}'
          if echo "$RESULTS" | grep -q '"failure"'; then ICON="❌"; \
          elif echo "$RESULTS" | grep -q '"cancelled"'; then ICON="⚠️"; \
          else ICON="✅"; fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '%s\n%s\n%s' \
            "${ICON} ${{ github.workflow }}" \
            "Branch: ${{ inputs.branch || 'main' }} | Server: ${{ inputs.server || 'all' }}" \
            "Run: ${RUN_URL}")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}"
